    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />


    <!-- Early Theme script to prevent flash of light mode -->
  <script>
      (function () {
        try {
          const theme = localStorage.getItem('theme') || 'system';
          let isDark = false;
          if (theme === 'system') {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else {
            isDark = theme === 'dark';
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>


     <!-- Prevent white flash before stylesheets/scripts load -->
    <style>
      html {
        background-color: hsl(40, 33%, 98%); /* Warm cream light mode background */
      }
      html.dark {
        background-color: hsl(200, 20%, 12%); /* Dark mode background */
      }
      body {
        background-color: inherit;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
